[project]
name = "kb-init"
version = "0.1.0"
description = "Compile your old note exports into a knowledge base your AI agent can actually use"
readme = "README.md"
# 上界不是保守，是不撒谎：classifiers 与 CI 矩阵只覆盖 3.12–3.13，
# 而 ">=3.12" 会让 3.14 用户装上一个从没被测过的组合。验过再放。
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "GiaSip" }]
keywords = ["knowledge-base", "notes", "markdown", "obsidian", "notion", "llm", "agent"]
# 分类如实反映**实测**的支持面，不写没验过的平台（见
# docs/superpowers/specs/2026-08-17-distribution-surface-design.md §2.2）：
# onnxruntime 不发 macOS x86_64 wheel，所以 Intel Mac 装不上——
# 声称支持一个装不上的平台，比不声称糟糕得多。
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Topic :: Utilities",
]
dependencies = ["PyYAML>=6.0", "numpy>=1.24", "scikit-learn>=1.3", "fastembed>=0.3"]

# 只写**已经存在**的链接——一个 404 的链接是产物撒谎的最省事版本。
[project.urls]
Homepage = "https://github.com/GiaSip/kb-init"
Repository = "https://github.com/GiaSip/kb-init"
Issues = "https://github.com/GiaSip/kb-init/issues"
Changelog = "https://github.com/GiaSip/kb-init/blob/main/CHANGELOG.md"

[project.scripts]
kb-init = "kb_init.cli:main_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_init"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
markers = ["smoke: 需要真实模型缓存，不进常规 CI"]
addopts = "-m 'not smoke'"
# 仓库根要在 sys.path 上，`from tests.fakes import …` 才成立。
#
# 以前它"能跑"靠的是 `python -m pytest` 这个跑法——`-m` 会把当前目录塞进
# sys.path，于是本地全绿。CI 用的是 `uv run pytest`（控制台入口，不加当前目录），
# 六个格子全部 collection error。写在这里之后两种跑法一致，不再依赖谁记得用哪条命令。
pythonpath = ["."]
